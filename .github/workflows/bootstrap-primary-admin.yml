name: Bootstrap Primary Admin

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Create Primary Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIMARY_ADMIN_NAME: ${{ secrets.PRIMARY_ADMIN_NAME }}
      PRIMARY_ADMIN_EMAIL: ${{ secrets.PRIMARY_ADMIN_EMAIL }}
      PRIMARY_ADMIN_PASSWORD: ${{ secrets.PRIMARY_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required secrets
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRIMARY_ADMIN_NAME PRIMARY_ADMIN_EMAIL PRIMARY_ADMIN_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required repository secret: $key"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply production D1 migrations
        run: npm run db:migrate:remote

      - name: Generate Primary Admin SQL
        run: node scripts/bootstrap-super-admin-from-env.mjs > /tmp/primary-admin.sql

      - name: Create Primary Admin in production D1
        run: npx wrangler d1 execute nightsafe-db --remote --file=/tmp/primary-admin.sql

      - name: Remove temporary SQL
        if: always()
        run: rm -f /tmp/primary-admin.sql
