name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend and Pages build checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit user-facing translation candidates
        run: node scripts/i18n-audit.mjs
      - name: Build frontend
        run: npm run build
      - name: Validate Pages API proxy syntax
        run: node --check 'functions/api/[[path]].js'

  worker:
    name: Worker checks and D1 invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle Worker without deploying
        run: npm run bundle:check
      - name: Test D1 business invariants
        run: npm run test:invariants
