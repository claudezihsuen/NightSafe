name: Deploy Staging Worker

on:
  workflow_dispatch:

concurrency:
  group: nightsafe-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate staging D1 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle staging Worker before touching Cloudflare
        run: npm run bundle:check:staging

      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging:remote

      - name: Deploy staging Worker
        run: npm run deploy:staging
