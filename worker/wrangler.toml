name = "nightsafe-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "nightsafe-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# For production, override vars via `wrangler deploy` environments or the
# dashboard, e.g.:
# [env.production.vars]
# ENVIRONMENT = "production"
# FRONTEND_URL = "https://app.nightsafe.example"
