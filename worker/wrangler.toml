name = "nightsafe-api"
main = "src/app.ts"
compatibility_date = "2024-09-23"

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://nightsafe.pages.dev"

[triggers]
crons = ["* * * * *", "17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nightsafe-db"
database_id = "451d7ba8-5ee9-47e6-b710-1795f02c18bb"

[[r2_buckets]]
binding = "FILES"
bucket_name = "nightsafe-files"

# The base configuration above is production. Use `wrangler deploy` for
# production and `wrangler deploy --env staging` for the isolated staging
# environment below.

# =============================================================================
# STAGING — isolated D1/R2/Worker. Browser requests are only accepted from
# Pages previews and the dedicated `development` Pages preview alias.
# =============================================================================
[env.staging]
name = "nightsafe-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_URL = "https://development.nightsafe.pages.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "nightsafe-staging-db"
database_id = "d5bb2e5f-b86e-483a-9115-517f3e88c61b"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "nightsafe-staging-files"
