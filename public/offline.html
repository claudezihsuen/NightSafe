<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#1B2B22" />
  <title>NightSafe · Offline</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2b22;background:#f7f8f5}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:440px;border:1px solid #dfe5df;background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 35px rgba(27,43,34,.08);text-align:center}.mark{width:52px;height:52px;margin:0 auto 16px;border-radius:16px;background:#eaf1eb;display:grid;place-items:center;font-size:25px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.55;color:#5c6b62;margin:0}.small{font-size:13px;margin-top:14px;color:#7c8981}

<body>
  <main class="card">
    <div class="mark" aria-hidden="true">⌂</div>
    <h1>NightSafe is offline</h1>
    <p>Reconnect to view your private rental information. NightSafe does not cache rent, payments, receipts, documents, or session data for offline access.</p>
